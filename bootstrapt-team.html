<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Landing Page Exercise</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- 1. Navigation Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DevBrand</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="servicesDropdown" role="button"
                            data-bs-toggle="dropdown">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Web Development</a></li>
                            <li><a class="dropdown-item" href="#">UI/UX Design</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
                <form class="d-flex ms-auto gap-2" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                    <button class="btn btn-primary text-nowrap" type="button">Sign Up</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 3. PROFILE CARD -->
    <section id="about" class="py-5 bg-white">
        <div class="container">
            <h2 class="text-center section-title"> My Profile </h2>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card text-center shadow">
                        <div class="card-body p-4">
                            <img src="https://i.pravatar.cc/150?img=12" alt="PHORS IM" class="profile-avatar mb-3">
                            <h3 class="card-title"> PHORS IM </h3>
                            <p class="text-muted"> Frontend Developer Student </p>
                            <p class="card-text"> I am an IT student who loves web design, programming and modern
                                technologies. </p>
                            <div class="mb-4"> <span class="badge rounded-pill bg-primary"> Student </span> <span
                                    class="badge rounded-pill bg-success"> Developer </span> <span
                                    class="badge rounded-pill bg-dark"> Bootstrap </span> </div>
                            <button class="btn btn-outline-primary me-2"> <i class="bi bi-chat"></i> Message </button>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                                <i class="bi bi-pencil"></i> Edit Profile </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 4. EDIT PROFILE MODAL  -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel"> Edit Profile </h5> <button type="button"
                        class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3"> <label class="form-label"> Full Name </label> <input type="text"
                                class="form-control" value="PHORS IM"> </div>
                        <div class="mb-3"> <label class="form-label"> Email </label> <input type="email"
                                class="form-control" placeholder="example@gmail.com"> </div>
                        <div class="mb-3"> <label class="form-label"> Bio </label> <textarea class="form-control"
                                rows="3">Frontend Developer Student</textarea> </div>
                    </form>
                </div>
                <div class="modal-footer"> <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close </button> <button type="button" class="btn btn-primary"> Save Changes </button> </div>
            </div>
        </div>
    </div>
